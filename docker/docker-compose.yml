version: '3.8'

services:
  # Redis
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - local-custom-network

networks:
  local-custom-network:
    driver: bridge

volumes:
  redis-data:
