spring:
  application:
    name: bookstore

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop # test
    properties:
      hibernate:
        show-sql: true
        format_sql: true
    open-in-view: false

  # h2 db datasource
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MariaDB
    username: sa
    password:

  data:
    redis:
      host: localhost
      timeout: 10000ms
      port: 6379
      connect-timeout: 500
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
        shutdown-timeout: 100ms
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10분
      cache-null-values: false
    cache-names:
      - sameIsbnBooks
      - booksByCategory
      - booksByTitle
      - booksByAuthor
      - booksByTitleAndAuthor
logging:
  level:
    org.springframework.security: DEBUG