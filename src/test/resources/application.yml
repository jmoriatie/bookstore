spring:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        highlight_sql: true # ANSI 코드에 색
        use_sql_comments: true # SQL 내부에 /* */ 주석 추가
    open-in-view: false

  h2:
    console:
      enabled: true

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MariaDB
    username: sa
    password:

  sql:
    init:
      mode: always

  # 테스트용 내장 Redis
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10분
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

logging:
  level:
    org.hibernate:
        SQL: debug # logger에 출력
        orm.jdbc.bind: TRACE